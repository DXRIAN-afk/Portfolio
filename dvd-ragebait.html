        /* ----- Der Bildschirm ----- */
        #screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #111822;
            overflow: hidden;
            box-shadow: inset 0 0 120px rgba(0, 30, 60, 0.6);
            border: 2px solid #2a4a6a;
            box-sizing: border-box;
            z-index: 1;
        }

        /* ----- Flacker-Overlay ----- */
        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            background: #ffffff;
            mix-blend-mode: overlay;
        }

        #flash-overlay.active {
            opacity: 0.6;
            animation: flashColors 0.15s infinite alternate;
        }

        @keyframes flashColors {
            0%   { background-color: #ff0000; }
            10%  { background-color: #ff8800; }
            20%  { background-color: #ffff00; }
            30%  { background-color: #00ff00; }
            40%  { background-color: #00ffff; }
            50%  { background-color: #0088ff; }
            60%  { background-color: #8800ff; }
            70%  { background-color: #ff00ff; }
            80%  { background-color: #ff0088; }
            90%  { background-color: #ff4400; }
            100% { background-color: #ff0000; }
        }

        /* ----- DVD-Container mit Rahmen ----- */
        #dvd-container {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #dvd-frame {
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border: 3px solid rgba(255, 255, 255, 0.7);
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15),
                        inset 0 0 15px rgba(255, 255, 255, 0.05);
            pointer-events: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        #dvd-logo {
            display: block;
            width: 140px;
            height: auto;
            aspect-ratio: 332 / 155;
            background-color: #ffffff;
            -webkit-mask-image: var(--dvd-logo-img);
            mask-image: var(--dvd-logo-img);
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.15));
            position: relative;
            z-index: 1;
            transition: background-color 0.15s ease;
        }

        /* ----- Zähler ----- */
        #counter {
            position: fixed;
            top: 20px;
            right: 24px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            padding: 4px 14px;
            border-radius: 30px;
            color: #6a9ab8;
            font-size: 0.75rem;
            font-family: 'Fira Mono', monospace;
            border: 1px solid rgba(74, 122, 156, 0.2);
            z-index: 100;
            letter-spacing: 0.05em;
            pointer-events: none;
        }
        #counter span {
            color: #b0d4f0;
            font-weight: 600;
        }

        /* ----- Laufzeitanzeige (unter dem Zähler) ----- */
        #runtime-display {
            position: fixed;
            top: 52px;
            right: 24px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            padding: 2px 12px;
            border-radius: 20px;
            color: #6a9ab8;
            font-size: 0.6rem;
            font-family: 'Fira Mono', monospace;
            border: 1px solid rgba(74, 122, 156, 0.15);
            z-index: 100;
            pointer-events: none;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }
        #runtime-display span {
            color: #b0d4f0;
        }

        /* ----- Ecktreffer-Anzeige ----- */
        #corner-hit {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            padding: 6px 22px;
            border-radius: 40px;
            color: #ffcc44;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            border: 1px solid rgba(255, 200, 50, 0.3);
            z-index: 100;
            white-space: nowrap;
            pointer-events: none;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        #corner-hit.show {
            opacity: 1;
        }

        /* ----- Responsive ----- */
        @media (max-width: 700px) {
            #dvd-logo { width: 100px; }
            #dvd-frame { top: -5px; left: -5px; right: -5px; bottom: -5px; border-width: 2.5px; }
            #counter { font-size: 0.65rem; padding: 3px 12px; top: 16px; right: 18px; }
            #runtime-display { font-size: 0.5rem; top: 44px; right: 18px; padding: 2px 10px; }
        }
        @media (max-width: 450px) {
            #dvd-logo { width: 70px; }
            #dvd-frame { top: -4px; left: -4px; right: -4px; bottom: -4px; border-width: 2px; }
            #counter { font-size: 0.55rem; padding: 2px 10px; top: 12px; right: 14px; }
            #runtime-display { font-size: 0.45rem; top: 36px; right: 14px; padding: 2px 8px; }
            #corner-hit { font-size: 0.65rem; padding: 4px 14px; bottom: 14px; }
        }
    </style>
</head>
<body>

    <!-- Bildschirm -->
    <div id="screen"></div>

    <!-- Flacker-Overlay -->
    <div id="flash-overlay"></div>

    <!-- DVD-Container mit Rahmen -->
    <div id="dvd-container">
        <div id="dvd-frame"></div>
        <div id="dvd-logo"></div>
    </div>

    <!-- Zähler -->
    <div id="counter"># <span id="bounceCount">0</span></div>

    <!-- Laufzeitanzeige (unter dem Zähler) -->
    <div id="runtime-display">⏱ <span id="runtimeValue">00:00</span></div>

    <!-- Ecktreffer-Anzeige -->
    <div id="corner-hit">ECK-TREFFER</div>

    <script>
        (function() {
            "use strict";

            // ----- Elemente -----
            const screen = document.getElementById('screen');
            const container = document.getElementById('dvd-container');
            const logo = document.getElementById('dvd-logo');
            const frame = document.getElementById('dvd-frame');
            const flashOverlay = document.getElementById('flash-overlay');
            const cornerHit = document.getElementById('corner-hit');
            const bounceSpan = document.getElementById('bounceCount');
            const runtimeSpan = document.getElementById('runtimeValue');

            // ----- Variablen -----
            let x = 0;
            let y = 0;
            let speedX = 1.8;
            let speedY = 1.2;
            const baseSpeed = 1.6;

            let currentSpeedX = speedX;
            let currentSpeedY = speedY;
            let logoWidth = 140;
            let logoHeight = 65;
            let bounceCount = 0;
            let isFlashing = false;
            let flashTimeout = null;

            // Laufzeit
            let startTime = Date.now();
            let runtimeInterval = null;

            // Farbpalette
            const colors = [
                '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6',
                '#ff8a5c', '#00d2d3', '#f368e0', '#ff9ff3', '#54a0ff'
            ];
            let currentColorIndex = 0;

            // ----- Logo-Größe aktualisieren -----
            function updateLogoSize() {
                const screenWidth = screen.clientWidth;
                const screenHeight = screen.clientHeight;
                let size = Math.min(screenWidth, screenHeight) * 0.12;
                size = Math.min(Math.max(size, 60), 180);
                logoWidth = Math.round(size);
                logoHeight = Math.round(size * (155 / 332));
                logo.style.width = logoWidth + 'px';
                logo.style.height = logoHeight + 'px';
                container.style.width = logoWidth + 'px';
                container.style.height = logoHeight + 'px';
            }

            // ----- Farbe wechseln -----
            function changeColor() {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * colors.length);
                } while (newIndex === currentColorIndex && colors.length > 1);
                currentColorIndex = newIndex;
                const color = colors[currentColorIndex];
                logo.style.backgroundColor = color;
                frame.style.borderColor = color;
                frame.style.boxShadow = `0 0 25px ${color}55, inset 0 0 25px ${color}33`;
                logo.style.filter = `drop-shadow(0 0 18px ${color}66)`;
            }

            // ----- Laufzeit aktualisieren -----
            function updateRuntime() {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const seconds = String(elapsed % 60).padStart(2, '0');
                runtimeSpan.textContent = `${minutes}:${seconds}`;
            }

            // ----- Flacker-Effekt -----
            function startFlash() {
                if (isFlashing) return;
                isFlashing = true;
                flashOverlay.classList.add('active');
                cornerHit.classList.add('show');
                if (flashTimeout) clearTimeout(flashTimeout);
                flashTimeout = setTimeout(() => {
                    flashOverlay.classList.remove('active');
                    cornerHit.classList.remove('show');
                    isFlashing = false;
                    flashTimeout = null;
                }, 2000);
            }

            // ----- Prall-Ereignis -----
            function onBounce(corner = false) {
                bounceCount++;
                if (bounceSpan) {
                    bounceSpan.textContent = bounceCount;
                }
                changeColor();
                container.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    container.style.transform = 'scale(1)';
                }, 80);
                if (corner) {
                    startFlash();
                }
            }

            // ----- Eck-Erkennung -----
            function checkCorner(x, y, w, h, sw, sh) {
                const tolerance = 2;
                const left = x <= tolerance;
                const right = x + w >= sw - tolerance;
                const top = y <= tolerance;
                const bottom = y + h >= sh - tolerance;
                return (left && top) || (left && bottom) || (right && top) || (right && bottom);
            }

            // ----- Haupt-Animation -----
            function animate() {
                const screenWidth = screen.clientWidth;
                const screenHeight = screen.clientHeight;

                x += currentSpeedX;
                y += currentSpeedY;

                let bounced = false;
                let corner = false;

                if (x < 0) {
                    x = 0;
                    currentSpeedX = Math.abs(currentSpeedX);
                    bounced = true;
                }
                if (x + logoWidth > screenWidth) {
                    x = screenWidth - logoWidth;
                    currentSpeedX = -Math.abs(currentSpeedX);
                    bounced = true;
                }
                if (y < 0) {
                    y = 0;
                    currentSpeedY = Math.abs(currentSpeedY);
                    bounced = true;
                }
                if (y + logoHeight > screenHeight) {
                    y = screenHeight - logoHeight;
                    currentSpeedY = -Math.abs(currentSpeedY);
                    bounced = true;
                }

                if (bounced) {
                    corner = checkCorner(x, y, logoWidth, logoHeight, screenWidth, screenHeight);
                    onBounce(corner);
                }

                container.style.left = x + 'px';
                container.style.top = y + 'px';

                requestAnimationFrame(animate);
            }

            // ----- Initialisierung -----
            function init() {
                updateLogoSize();

                const screenWidth = screen.clientWidth;
                const screenHeight = screen.clientHeight;

                x = Math.round(Math.random() * (screenWidth - logoWidth));
                y = Math.round(Math.random() * (screenHeight - logoHeight));

                const angle = Math.random() * Math.PI * 2;
                const speed = baseSpeed * (0.7 + Math.random() * 0.6);
                speedX = Math.cos(angle) * speed;
                speedY = Math.sin(angle) * speed;

                if (Math.abs(speedX) < 0.5) speedX = (speedX > 0 ? 1 : -1) * 0.8;
                if (Math.abs(speedY) < 0.5) speedY = (speedY > 0 ? 1 : -1) * 0.8;

                currentSpeedX = speedX;
                currentSpeedY = speedY;
                changeColor();

                container.style.left = x + 'px';
                container.style.top = y + 'px';

                bounceCount = 0;
                if (bounceSpan) bounceSpan.textContent = '0';

                // Laufzeit starten
                startTime = Date.now();
                updateRuntime();
                runtimeInterval = setInterval(updateRuntime, 1000);

                animate();
            }

            // ----- Bei Fenstergrößenänderung -----
            function handleResize() {
                const oldWidth = logoWidth;
                const oldHeight = logoHeight;
                updateLogoSize();

                const scaleX = logoWidth / oldWidth;
                const scaleY = logoHeight / oldHeight;
                const screenWidth = screen.clientWidth;
                const screenHeight = screen.clientHeight;

                let newX = x * scaleX;
                let newY = y * scaleY;

                if (newX < 0) newX = 0;
                if (newY < 0) newY = 0;
                if (newX + logoWidth > screenWidth) newX = screenWidth - logoWidth;
                if (newY + logoHeight > screenHeight) newY = screenHeight - logoHeight;

                x = Math.round(newX);
                y = Math.round(newY);
                container.style.left = x + 'px';
                container.style.top = y + 'px';
            }

            // ----- Event-Listener -----
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', function() {
                setTimeout(handleResize, 200);
            });

            // ----- Doppelklick auf Screen wechselt Farbe (versteckt) -----
            screen.addEventListener('dblclick', function() {
                changeColor();
            });

            // ----- Start -----
            setTimeout(init, 50);
            window.addEventListener('load', function() {
                setTimeout(init, 100);
            });

            console.log('DVD-Logo Screensaver gestartet');
        })();
    </script>
</body>
</html>
